<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLNA</title>
<style>
  :root {
    --orange: #00e5ff;
    --orange-glow: #a259ff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }

  /* ===== LOADING SCREEN ===== */
  .loading-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    animation: fadeOutLoading 0.8s ease forwards;
    animation-delay: 5s;
  }

  .spinner {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid rgba(0, 229, 255, 0.15);
    border-top: 4px solid var(--orange);
    animation: spin 1s linear infinite;
    margin-bottom: 28px;
  }

  .loading-text {
    color: #7fe8ff;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
    animation: pulseText 1.4s ease-in-out infinite;
  }

  .progress-bar {
    width: 220px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-top: 22px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--orange-glow));
    border-radius: 10px;
    animation: fillProgress 5s ease forwards;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @keyframes fillProgress {
    from { width: 0%; }
    to { width: 100%; }
  }

  @keyframes fadeOutLoading {
    to {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .logo-wrap {
    opacity: 0;
    transform: scale(0.7);
    animation: revealLogo 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 5.2s;
  }

  .slna-text {
    font-size: clamp(60px, 15vw, 150px);
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(180deg, #b6f7ff 0%, #00e5ff 40%, #a259ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(0, 229, 255, 0.5);
    position: relative;
  }

  .slna-text::after {
    content: "SLNA";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(180deg, #b6f7ff 0%, #00e5ff 40%, #a259ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: blur(25px);
    opacity: 0.6;
    z-index: -1;
  }

  .subtitle {
    margin-top: 18px;
    color: #7fe8ff;
    letter-spacing: 6px;
    font-size: 14px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 6.1s;
  }

  .underline {
    width: 0;
    height: 3px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    animation: growLine 1s ease forwards;
    animation-delay: 5.6s;
  }

  @keyframes revealLogo {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes growLine {
    to { width: 180px; }
  }

  /* particles nhẹ phía sau chữ */
  .particles span {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--orange-glow);
    border-radius: 50%;
    opacity: 0;
    animation: floatUp 4s ease-in-out infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-120px); opacity: 0; }
  }

  /* ===== HEARTS lơ lửng khắp màn hình ===== */
  .hearts-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }

  .heart {
    position: absolute;
    bottom: -40px;
    opacity: 0;
    color: var(--orange);
    filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.7));
    animation-name: heartFloat, heartSway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }

  .heart svg {
    display: block;
  }

  @keyframes heartFloat {
    0% {
      transform: translateY(0) rotate(0deg) scale(var(--s, 1));
      opacity: 0;
    }
    8% { opacity: 0.9; }
    85% { opacity: 0.7; }
    100% {
      transform: translateY(-110vh) rotate(20deg) scale(var(--s, 1));
      opacity: 0;
    }
  }

  @keyframes heartSway {
    0%, 100% { margin-left: 0; }
    50% { margin-left: 30px; }
  }

  /* ===== 4 ẢNH bay lơ lửng quanh màn hình ===== */
  .float-img {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid rgba(255,255,255,0.45);
    box-shadow: 0 0 28px rgba(0,229,255,0.4);
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    animation-name: floatOrbit-1, floatFadeIn;
    animation-timing-function: ease-in-out, ease;
    animation-iteration-count: infinite, 1;
    animation-fill-mode: none, forwards;
    animation-duration: 16s, 1s;
    animation-delay: 5.4s, 5.4s;
  }

  .float-img.f2 {
    width: 110px;
    height: 110px;
    animation-name: floatOrbit-2, floatFadeIn;
    animation-duration: 13s, 1s;
    animation-delay: 5.7s, 5.7s;
  }

  .float-img.f3 {
    width: 125px;
    height: 125px;
    animation-name: floatOrbit-3, floatFadeIn;
    animation-duration: 19s, 1s;
    animation-delay: 6.0s, 6.0s;
  }

  .float-img.f4 {
    width: 95px;
    height: 95px;
    animation-name: floatOrbit-4, floatFadeIn;
    animation-duration: 11s, 1s;
    animation-delay: 6.3s, 6.3s;
  }

  @keyframes floatFadeIn {
    to { opacity: 1; }
  }

  /* 4 đường bay khác nhau quanh màn hình, có nhấp nhô + xoay nhẹ như lơ lửng */
  @keyframes floatOrbit-1 {
    0%   { top: 8vh;  left: 8vw;  transform: translateY(0) rotate(0deg); }
    12%  { top: 6vh;  left: 45vw; transform: translateY(-14px) rotate(4deg); }
    25%  { top: 10vh; left: 85vw; transform: translateY(0) rotate(0deg); }
    37%  { top: 45vh; left: 90vw; transform: translateY(14px) rotate(-4deg); }
    50%  { top: 82vh; left: 85vw; transform: translateY(0) rotate(0deg); }
    62%  { top: 88vh; left: 45vw; transform: translateY(-14px) rotate(4deg); }
    75%  { top: 82vh; left: 8vw;  transform: translateY(0) rotate(0deg); }
    87%  { top: 45vh; left: 5vw;  transform: translateY(14px) rotate(-4deg); }
    100% { top: 8vh;  left: 8vw;  transform: translateY(0) rotate(0deg); }
  }

  @keyframes floatOrbit-2 {
    0%   { top: 85vh; left: 85vw; transform: translateY(0) rotate(0deg); }
    15%  { top: 82vh; left: 45vw; transform: translateY(12px) rotate(-4deg); }
    30%  { top: 88vh; left: 8vw;  transform: translateY(0) rotate(0deg); }
    45%  { top: 50vh; left: 5vw;  transform: translateY(-12px) rotate(4deg); }
    60%  { top: 12vh; left: 10vw; transform: translateY(0) rotate(0deg); }
    75%  { top: 8vh;  left: 50vw; transform: translateY(12px) rotate(-4deg); }
    90%  { top: 15vh; left: 88vw; transform: translateY(0) rotate(0deg); }
    100% { top: 85vh; left: 85vw; transform: translateY(0) rotate(0deg); }
  }

  @keyframes floatOrbit-3 {
    0%   { top: 50vh; left: 5vw;  transform: translateY(0) scale(1); }
    20%  { top: 15vh; left: 30vw; transform: translateY(-10px) scale(1.06); }
    40%  { top: 10vh; left: 70vw; transform: translateY(0) scale(1); }
    60%  { top: 50vh; left: 92vw; transform: translateY(10px) scale(1.06); }
    80%  { top: 85vh; left: 60vw; transform: translateY(0) scale(1); }
    100% { top: 50vh; left: 5vw;  transform: translateY(0) scale(1); }
  }

  @keyframes floatOrbit-4 {
    0%   { top: 20vh; left: 70vw; transform: translateY(0) rotate(0deg); }
    25%  { top: 55vh; left: 88vw; transform: translateY(-10px) rotate(5deg); }
    50%  { top: 80vh; left: 40vw; transform: translateY(0) rotate(0deg); }
    75%  { top: 55vh; left: 10vw; transform: translateY(10px) rotate(-5deg); }
    100% { top: 20vh; left: 70vw; transform: translateY(0) rotate(0deg); }
  }
</style>
</head>
<body>

  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="hearts-layer" id="heartsLayer"></div>

  <img class="float-img f1" src="images/1.jpg" alt="">
  <img class="float-img f2" src="images/1.jpg" alt="">
  <img class="float-img f3" src="images/1.jpg" alt="">
  <img class="float-img f4" src="images/1.jpg" alt="">

  <div class="main-content">
    <div class="particles" id="particles"></div>
    <div class="logo-wrap">
      <div class="slna-text">SLNA</div>
      <div class="underline"></div>
      <div class="subtitle">Sông Lam Nghệ An</div>
    </div>
  </div>

<script>
  // Tạo particle bay lên nhẹ nhàng phía sau chữ
  const container = document.getElementById('particles');
  const count = 25;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.style.left = (Math.random() * 100) + '%';
    p.style.top = (60 + Math.random() * 30) + '%';
    p.style.animationDelay = (5.5 + Math.random() * 3) + 's';
    p.style.animationDuration = (3 + Math.random() * 3) + 's';
    container.appendChild(p);
  }

  // Tạo trái tim bay lơ lửng khắp màn hình, bắt đầu từ sau khi logo xuất hiện
  const heartsLayer = document.getElementById('heartsLayer');
  const heartSVG = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21s-6.7-4.35-9.3-8.1C1 10.4 1.2 7 4 5.3c2.1-1.3 4.6-.8 6 1 1 .1 1 .1 2 0 1.4-1.8 3.9-2.3 6-1 2.8 1.7 3 5.1 1.3 7.6C18.7 16.65 12 21 12 21z"/>
    </svg>`;

  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = heartSVG;

    const size = 0.5 + Math.random() * 1.4;      // kích thước ngẫu nhiên
    const duration = 6 + Math.random() * 7;        // tốc độ bay lên
    const swayDuration = 2 + Math.random() * 2;    // tốc độ đung đưa
    const left = Math.random() * 100;              // vị trí ngang
    const delay = Math.random() * 2;

    h.style.left = left + 'vw';
    h.style.setProperty('--s', size);
    h.style.animationDuration = duration + 's, ' + swayDuration + 's';
    h.style.animationDelay = delay + 's, 0s';

    heartsLayer.appendChild(h);

    // tự xoá sau khi bay xong để không phình DOM
    setTimeout(() => h.remove(), (duration + delay) * 1000 + 200);
  }

  // Bắt đầu thả tim liên tục sau khi màn hình chính hiện ra (~5.2s)
  setTimeout(() => {
    spawnHeart();
    setInterval(spawnHeart, 450);
  }, 5300);
</script>

</body>
</html>
