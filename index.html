<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLNA</title>
<style>
  :root {
    --orange: #ff6a00;
    --orange-glow: #ffae42;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }

  /* ===== LOADING SCREEN ===== */
  .loading-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    animation: fadeOutLoading 0.8s ease forwards;
    animation-delay: 5s;
  }

  .spinner {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid rgba(255, 106, 0, 0.15);
    border-top: 4px solid var(--orange);
    animation: spin 1s linear infinite;
    margin-bottom: 28px;
  }

  .loading-text {
    color: #ffb066;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
    animation: pulseText 1.4s ease-in-out infinite;
  }

  .progress-bar {
    width: 220px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-top: 22px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--orange-glow));
    border-radius: 10px;
    animation: fillProgress 5s ease forwards;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @keyframes fillProgress {
    from { width: 0%; }
    to { width: 100%; }
  }

  @keyframes fadeOutLoading {
    to {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .logo-wrap {
    opacity: 0;
    transform: scale(0.7);
    animation: revealLogo 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 5.2s;
  }

  .slna-text {
    font-size: clamp(60px, 15vw, 150px);
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(180deg, #ffdd8a 0%, #ff8a00 45%, #ff5900 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 140, 0, 0.5);
    position: relative;
  }

  .slna-text::after {
    content: "SLNA";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(180deg, #ffdd8a 0%, #ff8a00 45%, #ff5900 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: blur(25px);
    opacity: 0.6;
    z-index: -1;
  }

  .subtitle {
    margin-top: 18px;
    color: #ffb066;
    letter-spacing: 6px;
    font-size: 14px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 6.1s;
  }

  .underline {
    width: 0;
    height: 3px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    animation: growLine 1s ease forwards;
    animation-delay: 5.6s;
  }

  @keyframes revealLogo {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes growLine {
    to { width: 180px; }
  }

  /* particles nhẹ phía sau chữ */
  .particles span {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--orange-glow);
    border-radius: 50%;
    opacity: 0;
    animation: floatUp 4s ease-in-out infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-120px); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="main-content">
    <div class="particles" id="particles"></div>
    <div class="logo-wrap">
      <div class="slna-text">SLNA</div>
      <div class="underline"></div>
      <div class="subtitle">Sông Lam Nghệ An</div>
    </div>
  </div>

<script>
  // Tạo particle bay lên nhẹ nhàng phía sau chữ
  const container = document.getElementById('particles');
  const count = 25;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.style.left = (Math.random() * 100) + '%';
    p.style.top = (60 + Math.random() * 30) + '%';
    p.style.animationDelay = (5.5 + Math.random() * 3) + 's';
    p.style.animationDuration = (3 + Math.random() * 3) + 's';
    container.appendChild(p);
  }
</script>

</body>
</html>
